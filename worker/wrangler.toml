name = "vybecord-art"
main = "src/index.js"
compatibility_date = "2026-08-20"

# Plain JS, no build step and no dependencies: wrangler uploads this file as is.
# Deliberate — the app already carries an antivirus reputation problem, and the
# less unsigned tooling in the tree the better.

[observability]
enabled = true

[[r2_buckets]]
binding = "ART"
bucket_name = "vybecord-art"

# 60 writes per minute per IP. A listener changes track at most a few times a
# minute and only uploads on a cache miss, so this is far above real use and far
# below what it takes to fill a bucket.
[[ratelimits]]
name = "UPLOAD_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Optional custom domain. The store is served from vybecord-art.vybecord.workers.dev
# today (the default art_upload_url in src/core/config.ts); a domain of our own
# would shed the phishing reputation shared Cloudflare subdomains carry. Uncomment
# once the zone is in this Cloudflare account, then change that default — covers
# are addressed by hash, so nothing needs migrating.
# [[routes]]
# pattern = "art.vybecord.app/*"
# custom_domain = true
