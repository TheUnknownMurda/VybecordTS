<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading Vybecord…</title>
  <meta name="robots" content="noindex">
  <!--
    A stable, shareable address for the installer.

    GitHub Pages is a plain file host: it cannot do the 302 that netlify.toml and
    vercel.json declare, so the redirect happens here instead. The meta refresh
    below fires with no JavaScript at all; the script just gets there sooner and
    lands on the .exe itself rather than the release page.
  -->
  <meta http-equiv="refresh" content="3; url=https://github.com/TheUnknownMurda/VybecordTS/releases/latest">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#06060a">
  <style>
    /* Same tokens as the landing page, inlined: this page must paint before
       any stylesheet request could possibly return. */
    :root { color-scheme: dark; --accent: #10b981; --accent-2: #34d399; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem;
      background: #06060a; color: #c9c9d3; text-align: center;
      font: 400 16px/1.65 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(40rem 26rem at 50% 0%, rgba(16, 185, 129, .14), transparent 65%);
    }
    .card { max-width: 32rem; }
    .mark {
      width: 46px; height: 46px; margin: 0 auto 1.5rem; border-radius: 13px;
      display: grid; place-items: center; color: #04120c;
      background: linear-gradient(150deg, var(--accent-2), var(--accent) 55%, #0e9f6e);
      box-shadow: 0 6px 22px -6px rgba(16, 185, 129, .6);
    }
    .mark svg { width: 24px; height: 24px; }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -.025em; color: #fafafa; margin-bottom: .5rem; }
    p { color: #9090a0; margin-bottom: 1.75rem; }
    .btn {
      display: inline-block; padding: .8rem 1.6rem; border-radius: 10px; font-weight: 600;
      font-size: .95rem; text-decoration: none; color: #04120c;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 1px 0 rgba(255,255,255,.28) inset, 0 6px 20px -6px rgba(16, 185, 129, .55);
    }
    .back { margin: 2.5rem 0 0; font-size: .875rem; }
    .back a { color: #9090a0; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.16); }
    .back a:hover { color: var(--accent-2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <h1>Starting your download…</h1>
    <p>If nothing happens, use the link below.</p>
    <a class="btn" id="fallback" href="https://github.com/TheUnknownMurda/VybecordTS/releases/latest">
      Go to the latest release
    </a>
    <p class="back"><a href="../">Back to the Vybecord site</a></p>
  </div>
  <script>
    /*
     * Resolve the installer asset so the click lands on the file, not on the
     * release page. Any failure — offline, rate-limited, a release with no
     * installer attached — is left to the meta refresh above.
     */
    (async () => {
      try {
        const res = await fetch('https://api.github.com/repos/TheUnknownMurda/VybecordTS/releases/latest', {
          headers: { Accept: 'application/vnd.github+json' },
        });
        if (!res.ok) return;
        const release = await res.json();
        const installer = (release.assets || []).find((a) => /-setup\.exe$/i.test(a.name));
        if (!installer) return;
        document.getElementById('fallback').href = installer.browser_download_url;
        window.location.replace(installer.browser_download_url);
      } catch { /* the meta refresh is the fallback */ }
    })();
  </script>
</body>
</html>
