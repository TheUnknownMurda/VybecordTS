<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      The renderer talks to the backend only through the preload bridge, so it
      needs no network access of its own. Locking the CSP down to 'self' means a
      lyric line or track title carrying markup can never pull in a remote
      script. 'unsafe-inline' for styles only, because album art drives a few
      inline background colours.
      img-src allows blob: (local cover art, delivered as bytes over IPC) and
      https for the album art URLs providers hand back.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'none'"
    />
    <title>Vybecord</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Ambient glow, tinted from the current album art -->
    <div id="ambient" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span></div>

    <!-- ── Custom title bar (the window is frameless) ── -->
    <header id="titlebar">
      <div class="tb-drag">
        <span class="tb-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg></span>
        <span class="tb-title">Vybecord</span>
      </div>
      <div class="tb-buttons">
        <button id="btnMin" class="tb-btn" title="Minimise" aria-label="Minimise">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
        </button>
        <button id="btnMax" class="tb-btn" title="Maximise" aria-label="Maximise">
          <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
        </button>
        <button id="btnClose" class="tb-btn tb-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </header>

    <!-- Only ever filled once an update is downloaded — see ui/src/update-banner.js -->
    <div id="updateBar" hidden aria-live="polite"></div>

    <div id="shell">
      <!-- ── Sidebar ── -->
      <nav id="sidebar" aria-label="Sections">
        <button class="nav-item" data-page="now" title="Now playing">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
          <span>Now playing</span>
        </button>
        <button class="nav-item" data-page="library" title="Lyrics">
          <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z" /><path d="M9 7h7M9 11h7" /></svg>
          <span>Lyrics</span>
        </button>
        <button class="nav-item" data-page="activity" title="Activity">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
          <span>Activity</span>
        </button>
        <button class="nav-item" data-page="settings" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" /><circle cx="15" cy="6" r="2" /><circle cx="9" cy="12" r="2" /><circle cx="17" cy="18" r="2" /></svg>
          <span>Settings</span>
        </button>
        <div class="nav-spacer"></div>
        <!-- Filled by paintStatus() in ui/src/main.js -->
        <div id="sideStatus" class="side-status" aria-live="polite"></div>
        <button class="nav-item" data-page="welcome" title="Help &amp; setup">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 115 .5c0 1.7-2.5 2-2.5 4" /><path d="M12 17.5v.01" /></svg>
          <span>Help &amp; setup</span>
        </button>
      </nav>

      <!-- ── Pages ── -->
      <main id="content">
        <section class="page" data-page="now"></section>
        <section class="page" data-page="library"></section>
        <section class="page" data-page="activity"></section>
        <section class="page" data-page="settings"></section>
        <section class="page" data-page="welcome"></section>
        <section class="page" data-page="report"></section>
      </main>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
