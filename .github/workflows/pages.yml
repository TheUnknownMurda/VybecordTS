# Publishes website/ to https://theunknownmurda.github.io/VybecordTS/
#
# The site is static and carries no binary: the installer lives on the release,
# which has no file-size cap, and the page reads it from the GitHub API at load
# time. So a new version needs a release, not a deploy.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so the last push wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tells the IndexNow search engines (Bing, and through it Yahoo and
      # DuckDuckGo, plus Yandex, Seznam and Naver) that the pages in
      # sitemap.xml changed, so they come back for them without waiting for a
      # crawl. Google is not part of IndexNow: it reads the sitemap through
      # Search Console. The key is public by design; it only proves the request
      # comes from whoever controls the site, by sitting in website/<key>.txt.
      # A failure here never fails the deploy: the site is already live.
      - name: Announce the pages to IndexNow
        continue-on-error: true
        env:
          KEY: 1aeb1fbb88d4cc3670a60dab3d8b2eab
          SITE: https://theunknownmurda.github.io/VybecordTS
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' website/sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -sc .)
          jq -n --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" \
            '{host: "theunknownmurda.github.io", key: $key, keyLocation: $loc, urlList: $urls}' > indexnow.json
          cat indexnow.json
          status=$(curl -sS -m 30 -o response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json https://api.indexnow.org/indexnow)
          echo "IndexNow answered HTTP $status"; cat response.txt; echo
          # 200: received. 202: received, the key is still being checked.
          case "$status" in 200|202) ;; *) exit 1 ;; esac
